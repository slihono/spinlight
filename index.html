<!DOCTYPE html>
<html lang="en,fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpinLight</title>
  <meta name="author" content="Seneve Lihono">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="start.css">
</head>
<body>

  <div class="page" id="page">

    <!-- Fond dégradé sombre rouge -->
    <div class="s0-bg"></div>
    <div class="scanlines"></div>

    <!-- Circuit board décoratif gauche (cyan) -->
    <svg class="circuit" viewBox="0 0 220 800" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M40 0 L40 120 L80 160 L80 250 L20 310 L20 400 L60 440 L60 550 L30 580 L30 800"
            stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
      <path d="M80 0 L80 60 L110 90 L110 180 L60 230"
            stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
      <circle cx="40"  cy="120" r="5" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
      <circle cx="80"  cy="250" r="5" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
      <circle cx="20"  cy="400" r="5" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
      <circle cx="60"  cy="550" r="5" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
      <circle cx="110" cy="180" r="3" fill="none" stroke="#00e5ff" stroke-width="1"   opacity="0.5"/>
      <path d="M40 120 L10 120"  stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
      <path d="M80 250 L120 250" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
      <path d="M20 400 L0 400"   stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
    </svg>

    <!-- Personnage sombre (SVG art) -->
<div class="dark-figure">
  <svg class="figure-svg" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Dégradé pour les pétales (noir pur) -->
      <radialGradient id="blackPetalGradient" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#000000" />
        <stop offset="100%" stop-color="#000000" />
      </radialGradient>

      <!-- Lueur très subtile pour les bords (gris foncé) -->
      <radialGradient id="petalGlow" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
      </radialGradient>

      <!-- Dégradé pour les feuilles (noir) -->
      <linearGradient id="blackLeafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#000000" />
        <stop offset="100%" stop-color="#000000" />
      </linearGradient>

      <!-- Filtre pour un effet de lueur très discrète -->
      <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Tige noire avec épines (inchangée) -->
    <path d="M250 600 L250 200" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <path d="M250 300 L245 290" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" />
    <path d="M250 400 L255 390" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" />
    <path d="M250 500 L245 490" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" />
    <path d="M250 550 L255 540" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" />

    <!-- Feuilles noires (inchangées) -->
    <path d="M250 350 Q180 250 160 300 Q200 330 250 320 Q300 330 340 300 Q320 250 250 350"
          fill="url(#blackLeafGradient)" stroke="#1a1a1a" stroke-width="1" />
    <path d="M250 450 Q180 350 160 400 Q200 430 250 420 Q300 430 340 400 Q320 350 250 450"
          fill="url(#blackLeafGradient)" stroke="#1a1a1a" stroke-width="1" />
    <path d="M250 500 Q270 450 220 430 Q200 400 250 480"
          fill="url(#blackLeafGradient)" stroke="#1a1a1a" stroke-width="1" />

    <!-- Pétales de la rose noire (forme gothique et anguleuse) -->
    <!-- Pétale central -->
    <path d="M250 180 L220 120 L200 150 L220 180 L250 200 L280 180 L300 150 L280 120 Z"
          fill="url(#blackPetalGradient)" filter="url(#subtleGlow)" />

    <!-- Pétales supérieurs -->
    <path d="M250 180 L200 100 L180 140 L200 170 L250 190 L300 170 L320 140 L300 100 Z"
          fill="url(#blackPetalGradient)" transform="rotate(0 250 180)" />
    <path d="M250 180 L200 100 L180 140 L200 170 L250 190 L300 170 L320 140 L300 100 Z"
          fill="url(#blackPetalGradient)" transform="rotate(45 250 180)" />
    <path d="M250 180 L200 100 L180 140 L200 170 L250 190 L300 170 L320 140 L300 100 Z"
          fill="url(#blackPetalGradient)" transform="rotate(-45 250 180)" />

    <!-- Pétales inférieurs -->
    <path d="M250 220 L200 280 L180 250 L200 230 L250 210 L300 230 L320 250 L300 280 Z"
          fill="url(#blackPetalGradient)" transform="rotate(0 250 220)" />
    <path d="M250 220 L200 280 L180 250 L200 230 L250 210 L300 230 L320 250 L300 280 Z"
          fill="url(#blackPetalGradient)" transform="rotate(30 250 220)" />
    <path d="M250 220 L200 280 L180 250 L200 230 L250 210 L300 230 L320 250 L300 280 Z"
          fill="url(#blackPetalGradient)" transform="rotate(-30 250 220)" />

    <!-- Bords des pétales (lueur très subtile) -->
    <path d="M250 180 L220 120 L200 150 L220 180 L250 200 L280 180 L300 150 L280 120 Z"
          fill="none" stroke="url(#petalGlow)" stroke-width="1" />
    <path d="M250 220 L200 280 L180 250 L200 230 L250 210 L300 230 L320 250 L300 280 Z"
          fill="none" stroke="url(#petalGlow)" stroke-width="1" />

    <!-- Centre de la rose (noir) -->
    <circle cx="250" cy="200" r="20" fill="#000000" />
    <circle cx="250" cy="200" r="10" fill="#1a1a1a" />
  </svg>
</div>
    <!-- Contenu texte gauche -->
    <div class="s0-left">
      <div class="tag-line"> SYSTEM_INIT — UA LITTLE ROCK / CS </div>

      <div class="big-name">
        <div class="glitch-wrap" data-text="SENEVE">SENEVE</div>
        <span class="glitch-wrap" data-text="LIHONO">LIHONO</span>
      </div>

      <div class="sub-name">Undergraduate · Computer Science · Developer</div>
      <div class="divider"></div>

      <!-- Bouton START avec anneaux pulsants -->
      <div class="btn-wrapper">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <button class="start-btn" id="startBtn">
          ACCESS THE PROFILE <span class="arrow">▶</span>
        </button>
      </div>
    </div>

  </div><!-- /page -->

  <!-- Points de progression -->
  <div class="progress">
    <span class="prog-dot active"></span>
    <a class="prog-dot" href="whoiam/whoiam.html"></a>
    <a class="prog-dot" href="vision/vision.html"></a>
    <a class="prog-dot" href="works/works.html"></a>
  </div>

  <script src="start.js"></script>
</body>
</html>
